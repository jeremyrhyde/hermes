<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Hermes</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script defer src="/ui/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="app()" x-cloak>

  <!--
    Inline icon symbol library. Lucide-derived (https://lucide.dev).
    Reference each symbol with: <svg class="icon"><use href="#icon-<name>"/></svg>
  -->
  <svg class="sr-only" aria-hidden="true" width="0" height="0">
    <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
      <path d="M12 9v4"/>
      <path d="M12 17h.01"/>
    </symbol>
    <!-- No fill/stroke attributes on the path: a presentation attribute beats
         an inherited value, so the star could not then be filled from CSS. -->
    <symbol id="icon-star" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.5 3.3a.6.6 0 0 1 1 0l2.4 5a.6.6 0 0 0 .5.3l5.4.8c.5.1.7.7.3 1l-3.9 3.8a.6.6 0 0 0-.2.6l1 5.4c.1.5-.5.9-.9.6l-4.8-2.5a.6.6 0 0 0-.6 0l-4.8 2.5c-.4.3-1-.1-.9-.6l1-5.4a.6.6 0 0 0-.2-.6l-4-3.8c-.3-.3-.1-.9.4-1l5.4-.8a.6.6 0 0 0 .5-.3Z"/>
    </symbol>
    <symbol id="icon-thumb-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/>
      <path d="M7 10l4.5-7a2 2 0 0 1 3.4 2l-1.2 5h5.1a2 2 0 0 1 2 2.5l-1.8 7A2 2 0 0 1 17 21H7"/>
    </symbol>
    <symbol id="icon-thumb-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 14V3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1z"/>
      <path d="M17 14l-4.5 7a2 2 0 0 1-3.4-2l1.2-5H5.2a2 2 0 0 1-2-2.5l1.8-7A2 2 0 0 1 7 3h10"/>
    </symbol>
  </svg>

  <!-- ------------------------------------------------------------------ -->
  <!-- Top bar                                                            -->
  <!-- ------------------------------------------------------------------ -->
  <header class="topbar">
    <h1 class="brand">Hermes</h1>
    <div class="topbar-right">
      <span class="clock" x-text="clockText"></span>
      <span class="ws-status"
            :class="wsConnected ? 'online' : 'offline'"
            :title="wsConnected ? 'Realtime connected' : 'Realtime disconnected'">
        <span class="dot" aria-hidden="true"></span>
        <span x-text="wsConnected ? 'live' : 'offline'"></span>
      </span>
    </div>
  </header>

  <!-- ------------------------------------------------------------------ -->
  <!-- Tabs — add a button + a matching <section> to grow the UI          -->
  <!-- ------------------------------------------------------------------ -->
  <nav class="tabs" role="tablist">
    <button role="tab" :aria-selected="tab === 'feed'"
            :class="{ active: tab === 'feed' }"
            @click="switchTab('feed')">Feed</button>
    <button role="tab" :aria-selected="tab === 'saved'"
            :class="{ active: tab === 'saved' }"
            @click="switchTab('saved')">Saved</button>
    <button role="tab" :aria-selected="tab === 'sources'"
            :class="{ active: tab === 'sources' }"
            @click="switchTab('sources')">Sources</button>
  </nav>

  <!-- ------------------------------------------------------------------ -->
  <!-- Category filters — Feed and Saved, and only when the API offers any. -->
  <!-- A zero-count filter is disabled, never hidden: a button vanishing   -->
  <!-- mid-interaction reads as a bug. A selected one stays clickable so   -->
  <!-- the selection is always reversible.                                 -->
  <!--                                                                     -->
  <!-- On Saved the row also hides when *nothing at all* is pinned, not    -->
  <!-- merely when nothing matches: every count would be 0, so a fully     -->
  <!-- disabled row above "Nothing saved yet" would read as broken rather  -->
  <!-- than empty.                                                         -->
  <!-- ------------------------------------------------------------------ -->
  <div class="filter-bar"
       x-show="tab !== 'sources' && categoryFilters.length > 0
               && (tab !== 'saved' || hasAnySaved)">
    <div class="filter-row">
      <div class="filter-scroll" role="group" aria-label="Filter by category">
        <template x-for="f in categoryFilters" :key="f.category">
          <button type="button" class="chip"
                  :class="{ active: f.selected }"
                  :disabled="!f.selected && f.count === 0"
                  :aria-pressed="f.selected"
                  @click="toggleCategory(f.category)"
                  x-text="`${f.category} (${f.count})`"></button>
        </template>
      </div>
      <!-- Outside the scroller on purpose: clear must stay reachable no
           matter how far along the strip you have scrolled. -->
      <button type="button" class="chip chip-clear" x-show="selected.length > 0"
              @click="clearCategories()">clear</button>
    </div>
  </div>

  <main>
    <!-- Startup-failure banner, populated from /health -->
    <template x-if="bootFailures.length > 0">
      <div class="banner" role="alert">
        <svg class="icon" aria-hidden="true"><use href="#icon-alert"/></svg>
        <div>
          <strong x-text="`${bootFailures.length} component(s) failed to start`"></strong>
          <ul>
            <template x-for="f in bootFailures" :key="f.component">
              <li><code x-text="f.component"></code> — <span x-text="f.error"></span></li>
            </template>
          </ul>
        </div>
      </div>
    </template>

    <!-- ---------------------------------------------------------------- -->
    <!-- Feed                                                             -->
    <!-- ---------------------------------------------------------------- -->
    <!-- One panel, one card template, both lists. Alpine has no component
         system without a build step, so a second copy of the card markup
         would be the copy that stops getting updated. `visibleItems` picks
         the list; nothing below it knows which tab it is rendering. -->
    <section x-show="tab !== 'sources'" role="tabpanel" class="panel">
      <div class="section-head">
        <h2 class="section-title">
          <span x-text="`${visibleItems.length} ${tab === 'saved' ? 'saved ' : ''}article${visibleItems.length === 1 ? '' : 's'}`"></span>
        </h2>
        <button class="btn btn-quiet" @click="refreshAll()">Refresh</button>
      </div>

      <!-- Two distinct empty states per tab. "Nothing yet" is about an empty
           database; a filtered miss means the user has articles, just none
           matching, and needs a way back rather than setup instructions. -->
      <template x-if="tab === 'feed' && items.length === 0 && selected.length === 0">
        <p class="empty">
          Nothing yet. Add feeds to <code>sources.yaml</code>, then
          <code>make poll-now ID=&lt;source-id&gt;</code>.
        </p>
      </template>

      <template x-if="tab === 'feed' && items.length === 0 && selected.length > 0">
        <p class="empty">
          <span x-text="selected.length === 1 ? 'No articles match this filter.' : `No articles match all ${selected.length} filters.`"></span>
          <button type="button" class="btn btn-quiet" @click="clearCategories()">Clear filters</button>
        </p>
      </template>

      <template x-if="tab === 'saved' && savedItems.length === 0 && selected.length === 0">
        <p class="empty">Nothing saved yet. Star an article in the Feed to keep it here.</p>
      </template>

      <template x-if="tab === 'saved' && savedItems.length === 0 && selected.length > 0">
        <p class="empty">
          <span>No saved articles match this filter.</span>
          <button type="button" class="btn btn-quiet" @click="clearCategories()">Clear filters</button>
        </p>
      </template>

      <ul class="feed" x-show="visibleItems.length > 0">
        <template x-for="item in visibleItems" :key="item.article_id">
          <li class="feed-item" :class="{ open: expanded === item.article_id }">
            <!-- The star is a sibling of the header button, not a child:
                 a button inside a button is invalid and browsers unnest it. -->
            <div class="feed-row">
            <button class="feed-head" @click="toggle(item)"
                    :aria-expanded="expanded === item.article_id">
              <span class="feed-score" x-show="item.score !== null"
                    x-text="item.score"></span>
              <span class="feed-main">
                <span class="feed-headline" x-text="item.headline"></span>
                <span class="feed-meta">
                  <span class="feed-source" x-text="item.source.name"></span>
                  <span x-text="relTime(item.published_at)"></span>
                </span>
              </span>
            </button>
            <button type="button" class="star" :class="{ on: item.saved }"
                    :aria-pressed="item.saved"
                    :aria-label="item.saved ? 'Remove from saved' : 'Save for later'"
                    :title="item.saved ? 'Remove from saved' : 'Save for later'"
                    @click.stop="toggleSaved(item)">
              <svg class="icon" aria-hidden="true"><use href="#icon-star"/></svg>
            </button>
            </div>

            <div class="feed-body" x-show="expanded === item.article_id" x-collapse>
              <ul class="bullets">
                <template x-for="(b, i) in item.bullets" :key="i">
                  <li x-text="b"></li>
                </template>
              </ul>
              <!-- Rating lives here, not in the header: you rate after
                   reading, and the header already carries the star. Three tap
                   targets in one 44px row invites misclicks on a phone. -->
              <div class="feed-actions">
                <a class="btn" :href="item.url" target="_blank" rel="noopener"
                   @click="recordClick(item)">Read the full article</a>
                <div class="rating" role="group" aria-label="Rate this article">
                  <button type="button" class="rate" :class="{ on: item.rating === 1 }"
                          :aria-pressed="item.rating === 1"
                          aria-label="Rate up"
                          @click="rate(item, 1)">
                    <svg class="icon" aria-hidden="true"><use href="#icon-thumb-up"/></svg>
                  </button>
                  <button type="button" class="rate" :class="{ on: item.rating === -1 }"
                          :aria-pressed="item.rating === -1"
                          aria-label="Rate down"
                          @click="rate(item, -1)">
                    <svg class="icon" aria-hidden="true"><use href="#icon-thumb-down"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </li>
        </template>
      </ul>
    </section>

    <!-- ---------------------------------------------------------------- -->
    <!-- Sources                                                          -->
    <!-- ---------------------------------------------------------------- -->
    <section x-show="tab === 'sources'" role="tabpanel" class="panel">
      <h2 class="section-title">Sources</h2>
      <ul class="source-list">
        <template x-for="s in sources" :key="s.id">
          <li class="source-row" :class="{ warn: s.disabled || s.error_count > 0 }">
            <span class="source-name" x-text="s.name"></span>
            <span class="source-state"
                  x-text="s.disabled ? 'disabled' : (s.enabled ? 'active' : 'paused')"></span>
            <span class="source-errors" x-show="s.error_count > 0"
                  x-text="`${s.error_count} error(s)`"></span>
            <!-- The only visibility into skipped posts: nothing else records
                 that an article was found unreadable. -->
            <span class="source-errors" x-show="s.unusable_count > 0"
                  x-text="`${s.unusable_count} unreadable`"></span>
          </li>
        </template>
      </ul>
    </section>
  </main>

</body>
</html>
