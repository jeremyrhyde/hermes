<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hermes" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      // Apply the saved Display preferences before first paint, so a Light
      // reader never sees a dark flash. Mirrors resolveTheme/resolveMotion in
      // src/lib/prefs.ts; prefs.svelte.ts takes over once the app mounts.
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem('hermes.prefs.v1') || '{}') || {}; } catch (e) {}
        var mm = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
        var root = document.documentElement;
        root.dataset.theme = p.theme === 'light' || p.theme === 'dark' ? p.theme
          : (mm('(prefers-color-scheme: light)') ? 'light' : 'dark');
        if (root.dataset.theme === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#f6f8fa'); // = --color-bg in tokens.css' light block
        }
        root.dataset.motion = p.motion === 'full' || p.motion === 'reduced' ? p.motion
          : (mm('(prefers-reduced-motion: reduce)') ? 'reduced' : 'full');
      })();
    </script>
    <title>Hermes</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
